const defaults=[{id:'IP-001',title:'明确项目成果与背景知识产权边界',scenario:'全部',level:'高',enabled:true,source:'civil',keywords:['成果归属','背景知识产权'],note:'区分既有工具、项目定制成果、可复用组件，并列明许可范围。'},{id:'IP-002',title:'训练数据授权与用途限制',scenario:'AI 大模型',level:'高',enabled:true,source:'ai',keywords:['训练授权','数据来源'],note:'约定数据来源证明、训练用途、留存期限与删除机制。'},{id:'IP-003',title:'FDE 交付与复用范围',scenario:'FDE 驻场开发',level:'中',enabled:true,source:'civil',keywords:['交付清单','复用许可'],note:'FDE 为本 Demo 中的驻场工程交付场景；明确源码、文档、组件复用与退出移交。'}];
function draft(rule,role){const own=role==='甲方'?'定制项目成果归甲方所有；乙方保留背景知识产权并授予甲方履行项目所需的持续使用许可。':role==='乙方'?'乙方保留背景知识产权及通用组件；项目定制成果按交付清单约定，甲方取得约定业务范围内的使用许可。':'双方以附件分别列明背景知识产权、定制成果及使用许可，未经约定不得扩大使用范围。';return rule.id==='IP-002'?'双方应保证各自提供的数据具有合法来源和相应授权。未经数据提供方书面同意，不得将项目数据用于通用模型训练；应在终止后按约定删除并提供记录。':rule.id==='IP-003'?own+' 双方以附件明确交付清单、验收标准、复用许可及退出移交安排。':own;}

</script><script>
const publicDemo=!!globalThis.location?.hostname?.endsWith('.github.io');
const backendState={online:false,aiConfigured:false,model:null,mode:'rules',busy:false,chatBusy:false,sessionId:null,messages:[],question:'',questions:[],resultMode:null,reviewedAt:null,error:'',revision:0};
async function apiRequest(route,body){
 const response=await fetch(route,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(75000)});
 let value;try{value=await response.json()}catch{throw Error('当前服务未提供后端接口，请使用 node server.cjs 启动新版服务。')}
 if(!response.ok)throw Error(value.error?.message||'请求失败，请重试。');return value;
}
async function checkBackend(){if(publicDemo){backendState.online=false;backendState.aiConfigured=false;render();return}try{const h=await apiRequest('/api/health');backendState.online=!!h.ok;backendState.aiConfigured=h.aiConfigured;backendState.model=h.model;backendState.error=''}catch{backendState.online=false;backendState.aiConfigured=false}render()}
function resetBackendContext(){backendState.revision++;backendState.sessionId=null;backendState.messages=[];backendState.questions=[];backendState.question='';backendState.resultMode=null;backendState.reviewedAt=null;backendState.error=''}
function backendPanel(){return `<section class="panel backend-panel"><div class="panel-head"><h2>审查服务 <span class="badge ${backendState.online?'':'amber'}">${backendState.online?'后端已连接':publicDemo?'公开演示版':'浏览器模式'}</span></h2><button class="link" id="backend-config">${publicDemo?'使用说明':'连接与配置'}</button></div><div class="pad"><div class="toolbar"><label for="review-mode">审查方式</label><select id="review-mode" ${backendState.busy?'disabled':''}><option value="rules" ${backendState.mode==='rules'?'selected':''}>规则审查</option><option value="ai" ${backendState.mode==='ai'?'selected':''} ${!backendState.aiConfigured?'disabled':''}>AI 语义审查${!backendState.aiConfigured?'（待配置模型）':''}</option></select><span class="count">${backendState.aiConfigured?'模型：'+esc(backendState.model):(publicDemo?'AI 暂未开放，可使用浏览器规则审查':'未配置模型，可正常使用规则审查')}</span><button class="link" id="refresh-backend">刷新连接</button></div><p class="count">${backendState.mode==='ai'?'AI 审查会将合同、适用规则及提供的法律摘要发送至服务端配置的模型服务。':'规则审查使用当前启用规则。后端已连接时在本机服务处理；离线时在浏览器处理。'} 合同及对话不写入磁盘。</p>${backendState.error?`<div class="notice backend-error" role="alert">${esc(backendState.error)}</div>`:''}${backendState.resultMode?`<div class="badge">本次结果：${backendState.resultMode==='ai'?'AI 语义审查':'关键词规则审查'} · ${esc(backendState.reviewedAt||'')}</div>`:''}</div></section>`}
function chatPanel(){return `<section class="panel chat-panel"><div class="panel-head"><h2>合同追问与条款改写</h2><span class="badge">${backendState.sessionId?'当前 AI 审查会话':'先运行 AI 审查'}</span></div><div class="pad">${backendState.questions.length?`<div class="quote">需要补充的事实：<ul>${backendState.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}<div class="chat-history" role="log" aria-live="polite">${backendState.messages.map(m=>`<div class="chat-message ${m.role==='user'?'from-user':''}"><strong>${m.role==='user'?'你':'知界'}</strong><div>${esc(m.content)}</div>${m.sourceIds?.length?`<div class="item-bottom">${m.sourceIds.map(id=>`<button class="link" data-source="${esc(id)}">${esc(E.sources.find(s=>s.id===id)?.title||id)} ↗</button>`).join('')}</div>`:''}</div>`).join('')||'<p>完成 AI 审查后，可继续追问风险、补充事实或要求改写条款。切换合同、立场、场景或规则会清空当前会话。</p>'}${backendState.chatBusy?'<p role="status">知界正在回复…</p>':''}</div><form id="chat-form"><label class="count" for="chat-input">例如：我们是乙方，请保留通用组件复用权，并改写成果归属条款。</label><textarea id="chat-input" maxlength="4000" ${!backendState.sessionId||backendState.chatBusy?'disabled':''} placeholder="输入追问或条款改写要求…">${esc(backendState.question)}</textarea><div class="editor-foot"><span class="count">仅限当前合同会话 · 闲置 30 分钟后失效</span><button class="primary" ${!backendState.sessionId||backendState.chatBusy?'disabled':''}>${backendState.chatBusy?'回复中…':'发送追问 →'}</button></div></form></div></section>`}
async function runBackendReview(){
 if(backendState.busy)return;if(!state.text.trim())return toast('请先输入合同文本');if(state.text.length>60000)return toast('请将合同控制在 60000 字以内');
 resetBackendContext();state.results=null;const revision=backendState.revision;backendState.busy=true;render();
 try{
  let result;
  if(backendState.online)result=await apiRequest('/api/review',{mode:backendState.mode,contract:state.text,role:state.role,scenario:state.scenario,rules});
  else if(backendState.mode==='rules')result={mode:'rules',findings:E.review(state.text,state.scenario,state.role,rules),sessionId:null,questions:[],reviewedAt:new Date().toISOString()};
  else throw Error('后端未连接，请启动服务后重试。');
  if(revision!==backendState.revision)return;
  state.results=result.findings;backendState.resultMode=result.mode;backendState.reviewedAt=result.reviewedAt;backendState.sessionId=result.sessionId;backendState.questions=result.questions;
  toast(result.mode==='ai'?'AI 审查完成，请核验依据与建议':'规则审查完成，请逐项复核');
 }catch(e){if(revision===backendState.revision){backendState.error=e.name==='TimeoutError'?'请求超时，请重试。':e.message;toast('审查未完成，请查看服务提示')}}finally{backendState.busy=false;render()}
}
async function sendChat(e){
 e.preventDefault();if(!backendState.sessionId||backendState.chatBusy||!backendState.question.trim())return;
 const message=backendState.question,revision=backendState.revision;backendState.chatBusy=true;backendState.error='';render();
 try{const answer=await apiRequest('/api/chat',{sessionId:backendState.sessionId,message});if(revision!==backendState.revision)return;backendState.messages.push({role:'user',content:message},{role:'assistant',content:answer.answer,sourceIds:answer.sourceIds});backendState.question=''}catch(e){if(revision===backendState.revision)backendState.error=e.name==='TimeoutError'?'回复超时，请重试。':e.message}finally{backendState.chatBusy=false;render()}
}
function bindBackend(){
 if($('#run')){$('#run').onclick=runBackendReview;$('#run').disabled=backendState.busy;$('#run').textContent=backendState.busy?'正在审查…':backendState.mode==='ai'?'开始 AI 审查 →':'开始规则审查 →'}
 if($('#contract'))$('#contract').readOnly=backendState.busy;
 if($('#scenario'))$('#scenario').disabled=backendState.busy;
 document.querySelectorAll('[data-role],#sample,#file').forEach(x=>x.disabled=backendState.busy);
 if($('#review-mode'))$('#review-mode').onchange=e=>{backendState.mode=e.target.value;invalidate();render()};
 if($('#refresh-backend'))$('#refresh-backend').onclick=checkBackend;
 if($('#backend-config'))$('#backend-config').onclick=()=>publicDemo?modal('<h2>知界公开演示版</h2><p>可使用法律情报、合同规则审查、规则管理及报告导出。合同在你的浏览器中处理，不上传服务器；规则设置仅保存在你的浏览器。</p><p>AI 审查与连续追问暂未开放，需另行部署后端。情报为预置演示样本，非每日新增数据。</p>'):modal(`<h2>后端与模型配置</h2><p>连接状态：${backendState.online?'已连接本机后端':'未连接，当前仅支持浏览器规则审查'}</p><div class="quote draft">1. 安装 Node.js 22.16 或更高版本。\n2. 在项目目录运行 node server.cjs。\n3. 将 .env.example 复制为 .env。\n4. 在 .env 中填写 OPENAI_API_KEY 与 OPENAI_MODEL。\n5. 重启后端，刷新连接，选择 AI 语义审查。</div><p>密钥只在服务端配置，不要粘贴到合同或追问中。当前仅接入 OpenAI Responses 接口，其他供应商需支持相同协议并单独验证。未配置时不会调用模型或产生模型费用。</p>`);

}

</script><script>

let rules;try{rules=JSON.parse(localStorage.getItem('ip-rules-v1'))||structuredClone(E.defaults);if(!Array.isArray(rules)||!rules.every(r=>r && typeof r.id==='string' && typeof r.title==='string' && Array.isArray(r.keywords) && E.sources.some(s=>s.id===r.source)))throw Error();}catch{rules=structuredClone(E.defaults)}
let state={page:'intel',role:'甲方',scenario:'FDE 驻场开发',text:'甲方委托乙方开展项目开发。乙方负责部署系统并提供技术支持。项目产生的所有知识产权由双方另行协商。乙方可以将甲方提供的数据用于模型优化。',results:null,filter:'全部',query:'',saved:[],type:'全部'};
function persist(){try{localStorage.setItem('ip-rules-v1',JSON.stringify(rules))}catch{toast('浏览器存储不可用，本次修改仅在当前页面保留')}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}

function source(id){const s=E.sources.find(s=>s.id===id);modal(`<div class="eyebrow">OFFICIAL SOURCE / 法律依据</div><h2 style="margin:15px 0">${s.title}</h2><p>${s.agency} · 发布 ${s.date}</p><span class="badge">${s.article}</span><p>${s.summary}</p><div class="quote">来源核验：2026-10-20 · 官方页面<br>本 Demo 摘要为解释性整理，并非完整法律意见。具体适用须核查正文、效力及事实。</div><p><a href="${s.url}" target="_blank" rel="noopener noreferrer">访问官方原文 ↗</a></p>`)}

function intel(){let list=E.sources.filter(s=>(state.filter==='全部'||(state.filter==='法律法规'))&&(s.title+s.summary).includes(state.query));return `<div class="stats">${[['演示情报','02','官方来源 · 非当日新增'],['重点关注','01','AI 训练数据与授权'],['关联审查规则',String(rules.filter(r=>r.enabled).length).padStart(2,'0'),'规则可在知识库管理'],['实时监测','未接入','当前使用预置样本']].map(a=>`<div class="stat"><label>${a[0]}</label><strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('')}</div><div class="grid"><div class="panel"><div class="panel-head"><h2>情报动态 <span class="count">/ ${list.length} 条</span></h2><span class="badge amber">预置样本</span></div><div class="filters">${['全部','法律法规','司法案例'].map(f=>`<button class="chip ${state.filter===f?'on':''}" data-filter="${f}">${f}</button>`).join('')}<input type="search" id="search" placeholder="搜索标题、主题…" value="${esc(state.query)}" aria-label="搜索情报"></div>${list.map((s,i)=>`<article class="item"><div class="meta"><span class="badge">法律法规</span><span>${s.agency}</span><span>·</span><span>发布 ${s.date}</span><span class="badge amber">演示</span></div><h3>${s.title}</h3><p>${s.summary}</p><div><span class="tag">${s.id==='ai'?'AI 大模型':'技术开发'}</span><span class="tag">知识产权</span></div><div class="item-bottom"><span class="count">演示发现于 2026-10-20 · ${s.article}</span><button class="link" data-source="${s.id}">查看依据与原文 ↗</button></div></article>`).join('')||'<div class="empty">暂无匹配情报。司法案例尚未收录，避免以虚构案例充当法律依据。</div>'}</div><div class="panel rail"><h2>来源与采集状态</h2><span class="badge">2 个官方来源</span><div class="source-row">国家互联网信息办公室<small>官方原文 · 手动核验</small><div class="bar"><span></span></div></div><div class="source-row">国家市场监督管理总局<small>民法典转载 · 手动核验</small><div class="bar"><span></span></div></div><div class="rail-note">每日监测待接入<br>当前按钮仅模拟同步过程，不代表发现新法或完成在线采集。</div><div style="margin-top:28px"><h2>从情报到行动</h2><p>关联适用规则，进入工作台检查条款边界。</p><button class="secondary" data-go="review">前往审查工作台 →</button></div></div></div>`}
function review(){return `<div class="toolbar"><label>审查立场</label><div class="seg">${['甲方','乙方','中立'].map(r=>`<button class="${state.role===r?'on':''}" data-role="${r}">${r}</button>`).join('')}</div><label for="scenario">合作场景</label><select id="scenario">${['FDE 驻场开发','AI 大模型','委托研发','技术许可'].map(s=>`<option ${state.scenario===s?'selected':''}>${s}</option>`).join('')}</select><span class="count">规则集 v0.1 · ${rules.filter(r=>r.enabled).length} 条启用</span></div><div class="review-grid"><div class="panel"><div class="panel-head"><h2>合同原文</h2><button class="link" id="sample">载入演示合同</button></div><div class="pad"><p style="margin-top:0;font-size:12px">粘贴合同知识产权条款，或导入 UTF-8 TXT 文件。</p><textarea id="contract" aria-label="合同原文" placeholder="请粘贴需要审查的合同条款…">${esc(state.text)}</textarea><div class="editor-foot"><label class="link">导入 TXT<input type="file" id="file" accept=".txt,text/plain" style="display:none"></label><button class="primary" id="run">开始规则审查 →</button></div><div class="rail-note">规则模式仅检测关键词；AI 模式进行语义分析。<br>AI 模式将合同发送至模型服务，所有结果均须法务复核。</div></div></div><div class="panel"><div class="panel-head"><h2>审查发现 <span class="count">${state.results?'/ '+state.results.length+' 项':''}</span></h2><span class="badge amber">需法务复核</span></div>${state.results?state.results.length?state.results.map(r=>`<div class="result"><div class="meta"><span class="badge ${r.level==='高'?'red':'amber'}">${r.level}优先级</span><span>${esc(r.id)} · ${state.role}立场</span></div><h3>${esc(r.title)}</h3><p>${esc(r.evidence)}</p><div class="quote">合同线索：${esc(r.originalText!==undefined?(r.originalText||'未发现对应原文，属于条款缺失建议'):state.text.slice(0,140))}${r.originalText===undefined&&state.text.length>140?'…':''}</div><p>${esc(r.note)}</p><details><summary class="link">查看建议条款</summary><div class="quote">${esc(r.draft)}</div><button class="link" data-copy="${esc(r.id)}">复制建议条款</button></details><div class="item-bottom">${(r.sourceIds||(r.source?[r.source]:[])).map(id=>`<button class="link" data-source="${esc(id)}">依据：${esc(E.sources.find(s=>s.id===id)?.title||id)} ↗</button>`).join('')||'<span class="count">依据不足，需补充核验</span>'}<span class="count">${r.status}</span></div></div>`).join(''):'<div class="empty">本次没有返回审查发现。请核对规则与审查范围。<br>没有结果不代表无风险。</div>':'<div class="empty"><span style="font-size:35px">▤</span><br>准备好，开始一次有依据的审查<br><small>选择合作场景与立场后，点击开始规则审查</small></div>'}</div></div>`}
function knowledge(){return `<div class="stats">${[['规则总数',rules.length,'业务规则 · 浏览器本地存储'],['已启用',rules.filter(r=>r.enabled).length,'用于合同审查'],['覆盖来源',2,'官方法律依据'],['规则版本','v0.1','编辑后即时生效']].map(a=>`<div class="stat"><label>${a[0]}</label><strong>${a[1]}</strong><small>${a[2]}</small></div>`).join('')}</div><div class="panel"><div class="panel-head"><h2>审查规则库</h2><button class="link" id="reset">恢复默认规则</button></div><div class="rule-row rule-header"><span>规则名称 / 编号</span><span>适用场景</span><span>优先级</span><span>操作</span><span>启用</span></div>${rules.map(r=>`<div class="rule-row"><div>${esc(r.title)}<small>${r.id} · 关键词：${esc(r.keywords.join('、'))}</small></div><span class="count">${r.scenario}</span><span class="badge ${r.level==='高'?'red':'amber'}">${r.level}</span><button class="link" data-edit="${r.id}">编辑规则 ↗</button><input class="switch" type="checkbox" data-toggle="${r.id}" ${r.enabled?'checked':''} aria-label="启用 ${esc(r.title)}"></div>`).join('')}</div><div class="rail-note">规则的业务优先级由团队设定，并非对法律责任的自动判定。修改规则后，工作台旧结果会清空，需要重新审查。</div>`}
function invalidate(){state.results=null;resetBackendContext()}
function edit(id){const r=rules.find(r=>r.id===id)||{id:'IP-'+Date.now(),title:'',scenario:'全部',level:'中',source:'civil',keywords:[],note:'',enabled:true};modal(`<h2>${id?'编辑':'新建'}审查规则</h2><form id="ruleform" class="pad"><p>规则名称</p><input name="title" required maxlength="80" value="${esc(r.title)}" style="width:100%"><p>适用场景 / 优先级 / 法律来源</p><select name="scenario">${['全部','FDE 驻场开发','AI 大模型','委托研发','技术许可'].map(s=>`<option ${r.scenario===s?'selected':''}>${s}</option>`).join('')}</select> <select name="level">${['高','中','低'].map(s=>`<option ${r.level===s?'selected':''}>${s}</option>`).join('')}</select><p><select name="source">${E.sources.map(s=>`<option value="${s.id}" ${r.source===s.id?'selected':''}>${s.title}</option>`).join('')}</select></p><p>检测关键词（以中文逗号分隔）</p><input name="keywords" required value="${esc(r.keywords.join('，'))}" style="width:100%"><p>审查要点</p><textarea name="note" required>${esc(r.note)}</textarea><button class="primary">保存规则</button></form>`);$('#ruleform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={...r,...Object.fromEntries(f),keywords:f.get('keywords').split(/[,，]/).map(s=>s.trim()).filter(Boolean)};if(!v.title.trim()||!v.keywords.length)return toast('请填写名称和有效关键词');if(id)rules=rules.map(x=>x.id===id?v:x);else rules.push(v);persist();invalidate();$('#modal').close();render();toast('规则已保存')};}
function download(){if(!state.results)return toast('请先运行审查');const report={demo:true,engine:backendState.resultMode==='ai'?'AI 语义审查，非法律意见':'关键词规则引擎，非法律意见',model:backendState.resultMode==='ai'?backendState.model:null,questions:backendState.questions,chat:backendState.messages,role:state.role,scenario:state.scenario,contract:state.text,reviewedAt:new Date().toISOString(),results:state.results.map(r=>({...r,sourceDetail:E.sources.filter(s=>(r.sourceIds||(r.source?[r.source]:[])).includes(s.id))}))};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=url;a.download='知界-演示审查报告.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

et'))$('#reset').onclick=()=>{modal('<h2>恢复默认规则？</h2><p>这会替换当前浏览器中的规则修改。</p><button class="secondary" id="confirmReset">确认恢复</button>');$('#confirmReset').onclick=()=>{rules=structuredClone(E.defaults);persist();invalidate();$('#modal').close();render()}};$('#topAction').onclick=state.page==='intel'?()=>toast('模拟同步完成：使用 2 条预置样本，未连接实时采集'):state.page==='review'?download:()=>edit();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});render();

</script></body></html>
